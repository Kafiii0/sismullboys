<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" className="w-full h-full">
  <defs>
    <!-- Deep Red Gradients -->
    <linearGradient id="prm_crimson" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FF2E5B" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    
    <!-- Dark Titanium Facet -->
    <linearGradient id="prm_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="60%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="prm_edge_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="crimson_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shield Silhouette Aura -->
  <path 
    d="M60 10 L102 24 V64 C102 88 60 110 60 110 C60 110 18 88 18 64 V24 L60 10Z" 
    fill="url(#prm_metal)" 
    stroke="#27272A" 
    stroke-width="1.5"
  />

  <!-- Subtle Shield Inner Rim -->
  <path 
    d="M60 16 L96 28 V63 C96 83 60 102 60 102 C60 102 24 83 24 63 V28 L60 16Z" 
    stroke="url(#prm_edge_glow)" 
    stroke-width="1"
    fill="none"
  />

  <!-- The Monogram 'T' & Apex Core in Crimson Vector (Faceted Minimalist Luxury) -->
  <!-- Left Wing of T -->
  <path 
    d="M32 32 L56 32 L52 46 L38 46 L32 32Z" 
    fill="url(#prm_crimson)"
  />

  <!-- Right Wing of T (Slightly lighter reflection) -->
  <path 
    d="M64 32 L88 32 L82 46 L68 46 L64 32Z" 
    fill="#FF2E5B"
  />

  <!-- Central T-Head Cap -->
  <polygon 
    points="60,22 72,32 48,32" 
    fill="#FFFFFF" 
    opacity="0.9"
  />

  <!-- Central Pillar Stem / Cryptographic Dagger -->
  <path 
    d="M54 34 L66 34 L64 80 L60 92 L56 80 L54 34Z" 
    fill="url(#prm_crimson)" 
    filter="url(#crimson_glow)"
  />

  <!-- Inner Diamond Core (Cyber Precision Node) -->
  <polygon 
    points="60,42 66,54 60,66 54,54" 
    fill="#FFFFFF"
  />

  <!-- Left Accent Chevron -->
  <path 
    d="M36 54 L44 68 L40 72 L32 58 Z" 
    fill="url(#prm_crimson)" 
    opacity="0.65"
  />

  <!-- Right Accent Chevron -->
  <path 
    d="M84 54 L76 68 L80 72 L88 58 Z" 
    fill="url(#prm_crimson)" 
    opacity="0.85"
  />
</svg>
